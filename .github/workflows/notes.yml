name: Latest notes

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: https://nikhil-rai-portfolio-xi.vercel.app/feed.xml
          comment_tag_name: NOTES
          max_post_count: 5
